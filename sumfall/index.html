<title>Sumfall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-screen arcade column. HUD strip, time bar, square board, status line. Single committed dark look. */
:root{
  --bg:#0e1120; --panel:#151a2e; --tile:#1c2240; --tile-hi:#252c52; --edge:#323a66;
  --ink:#e7e9f6; --dim:#8b91b8; --accent:#ffb547; --gold:#f2c94c; --time:#4fd1c5; --bad:#ff5d73;
  --scrim:rgba(9,11,22,.78);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bs:max(240px,min(calc(100vw - 32px),calc(100vh - 212px),520px));
  --pc:var(--accent);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse 70% 55% at 50% 52%,color-mix(in srgb,var(--pc) calc(var(--heat,0)*14%),transparent),transparent 70%),var(--bg);transition:background .4s}
.lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}

/* HUD */
.hud{width:var(--bs);display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat.r{align-items:flex-end;text-align:right}
.stat .num{font-size:22px;line-height:1}
.target{display:flex;flex-direction:column;align-items:center;gap:0}
#target{font-weight:800;font-size:46px;line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums;transition:transform .2s,color .2s}
#target.bump{transform:scale(1.25);color:var(--accent)}
#live{font-family:var(--f-mono);font-size:11px;color:var(--dim);height:14px;white-space:nowrap}
#live.hit{color:var(--pc)} #live.over{color:var(--bad)}

.bar{width:var(--bs);height:12px;border-radius:6px;background:var(--panel);border:1px solid var(--edge);position:relative;overflow:hidden;box-sizing:border-box}
#timefill{position:absolute;inset:0;transform-origin:left center;background:linear-gradient(90deg,var(--time),color-mix(in srgb,var(--time) 60%,var(--ink)))}
.bar.low #timefill{background:var(--bad);animation:throb .5s ease-in-out infinite alternate}
.timerow{width:var(--bs);display:flex;align-items:center;gap:8px}
.timerow .bar{flex:1;width:auto}
#timetxt{font-family:var(--f-mono);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;min-width:4ch;text-align:right}
.timerow.low #timetxt{color:var(--bad)}
@keyframes throb{to{opacity:.55}}

/* Board */
.stage{width:var(--bs);height:var(--bs);position:relative;touch-action:none;flex:none}
.board{position:absolute;inset:0;overflow:hidden;border-radius:14px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--edge)}
.board.shake{animation:shake .28s}
@keyframes shake{20%{transform:translateX(-6px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}}
.tile{position:absolute;left:0;top:0;width:calc(100% / 6);height:calc(100% / 6);transform:translate(calc(var(--c) * 100%),calc(var(--r) * 100%));transition:transform .3s cubic-bezier(.3,1.35,.5,1)}
.face{position:absolute;inset:5%;border-radius:22%;background:linear-gradient(160deg,var(--tile-hi),var(--tile));box-shadow:inset 0 0 0 1px var(--edge),0 2px 0 rgba(0,0,0,.35);display:grid;place-items:center;
  font-family:var(--f-mono);font-weight:600;font-size:calc(var(--bs) * .075);transition:background .08s,color .08s,transform .1s}
.tag{position:absolute;top:6%;right:9%;font-style:normal;font-family:var(--f-mono);font-size:max(9px,calc(var(--bs) * .022));font-weight:600;letter-spacing:.02em}
.gold .face{box-shadow:inset 0 0 0 2px var(--gold),0 0 14px color-mix(in srgb,var(--gold) 35%,transparent)} .gold .tag{color:var(--gold)}
.sel .face{background:var(--pc);color:var(--bg);transform:scale(1.06)} .sel .tag{color:var(--bg)}
.stage.over .sel .face{background:var(--bad)}
.stage.hit .sel .face{box-shadow:0 0 0 2px var(--ink),0 0 22px var(--pc)}
.hint .face{animation:hint 1.1s ease-in-out infinite}
@keyframes hint{50%{box-shadow:inset 0 0 0 2px var(--ink),0 0 16px color-mix(in srgb,var(--ink) 40%,transparent)}}
.gone{transition:none}
.gone .face{background:var(--pc);color:var(--bg);animation:gone .26s ease-in forwards}
@keyframes gone{30%{transform:scale(1.18)}100%{transform:scale(0);opacity:0}}
.flip .face{animation:flip .35s}
@keyframes flip{50%{transform:scaleX(0)}}

.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#trail{fill:none;stroke:var(--pc);stroke-width:.16;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.stage.over #trail{stroke:var(--bad)}
.pops{position:absolute;inset:0;pointer-events:none}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-mono);font-weight:600;font-size:20px;color:var(--pc);text-shadow:0 2px 8px rgba(0,0,0,.6);white-space:nowrap;animation:rise .9s ease-out forwards}
.pop.word{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.04em;color:var(--ink);animation-duration:1.1s}
.pop.t{color:var(--time)}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 16px;border-radius:10px;background:var(--scrim);border:1px solid var(--edge);text-align:center;white-space:nowrap;animation:toast 1.4s ease forwards;pointer-events:none}
.toast b{display:block;font-weight:800;font-size:24px}
.toast span{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-40%)}12%,75%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-60%)}}

/* Footer */
.foot{width:var(--bs);display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.foot b{color:var(--ink);font-weight:600}
.lv{display:flex;align-items:center;gap:8px}
.pips{display:flex;gap:4px}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--edge)}
.pips i.on{background:var(--accent)}
.combo{display:flex;align-items:center;gap:6px}
.cbar{width:44px;height:4px;border-radius:2px;background:var(--edge);overflow:hidden}
#cfill{height:100%;background:var(--pc);transform-origin:left;transform:scaleX(0)}
#mute{background:none;border:1px solid var(--edge);border-radius:6px;padding:3px 8px;font-family:var(--f-mono);font-size:11px;color:var(--dim)}

/* Overlay */
.ov{position:fixed;inset:0;display:grid;place-items:center;background:var(--scrim);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
.card{width:min(380px,100%);max-height:100%;overflow:auto;box-sizing:border-box;background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.card h1{margin:0;font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.card h1 em{font-style:normal;color:var(--accent)}
.card h2{margin:0;font-size:14px;font-family:var(--f-mono);font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.rule{margin:0;font-size:15px;line-height:1.45;color:var(--ink);text-wrap:pretty}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:13px;line-height:1.35}
.facts dt{font-family:var(--f-mono);font-weight:600;color:var(--accent);white-space:nowrap}
.facts dt.g{color:var(--gold)} .facts dt.t{color:var(--time)}
.facts dd{margin:0;color:var(--dim)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 120px;padding:12px 14px;border-radius:10px;border:1px solid var(--edge);background:var(--tile);font-weight:800;font-size:16px;transition:transform .08s,background .15s}
.btn:hover{background:var(--tile-hi)}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn.main:hover{background:color-mix(in srgb,var(--accent) 85%,var(--ink))}
.meta{margin:0;font-family:var(--f-mono);font-size:11px;color:var(--dim);line-height:1.5}
.big{font-family:var(--f-mono);font-weight:600;font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.delta{font-family:var(--f-mono);font-size:13px;color:var(--dim)}
.delta.pb{color:var(--accent);font-weight:600}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin:0}
.res div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--edge);padding-bottom:4px}
.res dt{font-size:12px;color:var(--dim)} .res dd{margin:0;font-family:var(--f-mono);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){
  .tile{transition-duration:.12s;transition-timing-function:ease-out}
  .board.shake,.bar.low #timefill,.hint .face{animation:none}
  .pop{animation-duration:.7s}
}
</style>

<div class="app" id="app">
  <header class="hud">
    <div class="stat"><span class="lbl">Score</span><span class="num" id="score">0</span></div>
    <div class="target"><span class="lbl">Sum to</span><span id="target">10</span><span id="live">drag to chain</span></div>
    <div class="stat r"><span class="lbl" id="bestlbl">Best</span><span class="num" id="best">0</span></div>
  </header>
  <div class="timerow" id="timerow"><div class="bar" id="bar"><div id="timefill"></div></div><span id="timetxt">30.0</span></div>
  <div class="stage" id="stage">
    <div class="board" id="board"></div>
    <svg class="fx" viewBox="0 0 6 6" preserveAspectRatio="none" aria-hidden="true"><polyline id="trail" points=""></polyline></svg>
    <div class="pops" id="pops"></div>
  </div>
  <footer class="foot">
    <span class="lv">Lv <b id="lvl">1</b><span class="pips" id="pips"><i></i><i></i><i></i><i></i><i></i></span></span>
    <span class="combo">Combo <b id="combo">×1</b><span class="cbar"><span id="cfill" style="display:block"></span></span></span>
    <button id="mute" type="button">Sound on</button>
  </footer>
</div>

<div class="ov" id="ov">
  <div class="card" id="card"></div>
</div>

<script>
(() => {
  'use strict';
  const N = 6, START_T = 45, MAX_T = 60, LEVEL_BONUS = 10, COMBO_WIN = 3.5, LEVEL_CLEARS = 5, HINT_AFTER = 6;
  const $ = id => document.getElementById(id);
  const board = $('board'), stage = $('stage'), trail = $('trail'), pops = $('pops'), ov = $('ov'), card = $('card');
  const fmt = n => Math.round(n).toLocaleString('en-US');

  /* ---------- storage (per-viewer convenience; safe if blocked) ---------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem('sumfall:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('sumfall:' + k, JSON.stringify(v)); } catch (e) {} }
  };

  /* ---------- rng ---------- */
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function dayKey() { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
  function dayLabel() { const k = String(dayKey()); return k.slice(0, 4) + '-' + k.slice(4, 6) + '-' + k.slice(6); }
  let rng = mulberry32((Math.random() * 4294967296) >>> 0);
  const W = [0, 14, 14, 13, 12, 11, 10, 9, 9, 8], WT = W.reduce((a, b) => a + b, 0);
  function rollDigit() { let x = rng() * WT; for (let d = 1; d <= 9; d++) { x -= W[d]; if (x < 0) return d; } return 9; }
  function rollKind() { const x = rng(); return x < 0.05 ? 'gold' : ''; }

  /* ---------- audio ---------- */
  let actx = null, master = null, muted = store.get('muted', false);
  function audio() {
    if (!actx) {
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = actx.createDynamicsCompressor();
        master = actx.createGain(); master.gain.value = 0.5;
        master.connect(comp); comp.connect(actx.destination);
      } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
    return actx;
  }
  function tone(f, d = 0.12, type = 'sine', v = 0.16, when = 0, slide = 0) {
    if (muted || !actx || !master) return;
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.03);
  }
  const SC = [0, 2, 4, 7, 9];
  const note = i => { i = Math.max(0, Math.min(i, 17)); return 261.63 * Math.pow(2, (SC[i % 5] + 12 * Math.floor(i / 5)) / 12); };
  const sfx = {
    step(i) { tone(note(i), 0.09, 'triangle', 0.14); },
    hit(i) { tone(note(i + 2), 0.16, 'triangle', 0.16); tone(note(i + 4), 0.16, 'sine', 0.1); },
    over() { tone(150, 0.12, 'square', 0.07, 0, 110); },
    clear(L, combo) { const b = Math.min(combo - 1, 8); for (let j = 0; j < 4; j++) tone(note(b + j * 2 + (L > 5 ? 2 : 0)), 0.18, j % 2 ? 'sine' : 'triangle', 0.15, j * 0.045); },
    miss() { tone(120, 0.2, 'sawtooth', 0.08, 0, 70); },
    tick() { tone(1046, 0.05, 'sine', 0.08); },
    level() { [0, 4, 7, 12].forEach((s, j) => tone(392 * Math.pow(2, s / 12), 0.28, 'triangle', 0.12, j * 0.07)); },
    over_() { [7, 4, 0, -5].forEach((s, j) => tone(330 * Math.pow(2, s / 12), 0.3, 'triangle', 0.13, j * 0.12)); },
    shuffle() { for (let j = 0; j < 5; j++) tone(500 + j * 90, 0.05, 'square', 0.04, j * 0.03); }
  };
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  /* ---------- state ---------- */
  let grid = [], T = 10, level = 1, clears = 0, score = 0, shownScore = 0, time = START_T, combo = 0, bestCombo = 0,
      lastClearAt = -99, gameTime = 0, maxChain = 0, streak = 0, bestStreak = 0, earned = 0, cells = 0, idle = 0, hint = null, hintDone = false,
      path = [], dragging = false, pointerId = null, lastPt = null, clutch = false, lastTick = 99,
      state = 'menu', mode = 'endless', nextId = 0;

  const bestKey = () => mode === 'daily' ? 'best:daily:' + dayKey() : 'best:endless';
  const drain = () => Math.min(1 + (level - 1) * 0.08, 2);
  const comboMult = c => Math.min(1 + (Math.max(c, 1) - 1) * 0.25, 4);

  /* ---------- tiles ---------- */
  function place(t, row = t.r) { t.el.style.setProperty('--c', t.c); t.el.style.setProperty('--r', row); }
  function paint(t) {
    t.el.className = 'tile' + (t.k ? ' ' + t.k : '');
    t.el.innerHTML = '<div class="face"><span>' + t.v + '</span>' + (t.k === 'gold' ? '<i class="tag">×2</i>' : '') + '</div>';
  }
  function makeTile(r, c, fromRow) {
    const t = { id: nextId++, v: rollDigit(), k: rollKind(), r, c, el: document.createElement('div') };
    paint(t); place(t, fromRow); board.appendChild(t.el); return t;
  }
  function buildBoard(animate) {
    board.innerHTML = ''; grid = [];
    const fresh = [];
    for (let r = 0; r < N; r++) { grid.push([]); for (let c = 0; c < N; c++) { const t = makeTile(r, c, animate ? r - N - 1 : r); grid[r].push(t); fresh.push(t); } }
    if (animate) { void board.offsetWidth; fresh.forEach(t => { t.el.style.transitionDelay = (t.c * 0.025 + (N - t.r) * 0.02) + 's'; place(t); }); setTimeout(() => fresh.forEach(t => { t.el.style.transitionDelay = ''; }), 700); }
  }
  function gravity() {
    const fresh = [];
    for (let c = 0; c < N; c++) {
      let w = N - 1;
      for (let r = N - 1; r >= 0; r--) {
        const t = grid[r][c];
        if (t) { if (r !== w) { grid[w][c] = t; grid[r][c] = null; t.r = w; place(t); } w--; }
      }
      const missing = w + 1;
      for (let r = w; r >= 0; r--) { const t = makeTile(r, c, r - missing); grid[r][c] = t; fresh.push(t); }
    }
    if (fresh.length) { void board.offsetWidth; fresh.forEach(t => place(t)); }
  }

  /* ---------- solver ---------- */
  function findPath(target) {
    let budget = 200000; const seen = new Uint8Array(N * N), stack = [];
    function dfs(r, c, s) {
      if (--budget < 0) throw 0;
      const t = grid[r][c]; s += t.v;
      if (s > target) return false;
      seen[r * N + c] = 1; stack.push(t);
      if (s === target && stack.length >= 2) return true;
      if (s < target) {
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
          if (!dr && !dc) continue;
          const nr = r + dr, nc = c + dc;
          if (nr < 0 || nc < 0 || nr >= N || nc >= N || seen[nr * N + nc]) continue;
          if (s + grid[nr][nc].v <= target && dfs(nr, nc, s)) return true;
        }
      }
      seen[r * N + c] = 0; stack.pop(); return false;
    }
    try { for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (dfs(r, c, 0)) return stack.slice(); }
    catch (e) { return 'unknown'; }
    return null;
  }
  function ensureSolvable() {
    let tries = 0;
    while (findPath(T) === null && tries < 60) {
      tries++;
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) grid[r][c].v = rollDigit();
    }
    if (tries) {
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const t = grid[r][c]; paint(t); t.el.classList.add('flip'); }
      setTimeout(() => board.querySelectorAll('.flip').forEach(e => e.classList.remove('flip')), 400);
      toast('Reshuffled', 'no sum to ' + T + ' was left');
      sfx.shuffle();
    }
  }
  function clearHint() { if (hint && hint !== 'unknown') hint.forEach(t => t.el.classList.remove('hint')); hint = null; }

  /* ---------- path ---------- */
  const pathSum = () => path.reduce((a, t) => a + t.v, 0);
  function renderPath() {
    const s = pathSum(), over = s > T, hit = s === T && path.length >= 2;
    board.querySelectorAll('.tile.sel').forEach(e => e.classList.remove('sel'));
    path.forEach(t => t.el.classList.add('sel'));
    stage.classList.toggle('over', over); stage.classList.toggle('hit', hit);
    trail.setAttribute('points', path.map(t => (t.c + 0.5) + ',' + (t.r + 0.5)).join(' '));
    const live = $('live');
    live.className = hit ? 'hit' : over ? 'over' : '';
    live.textContent = path.length ? 'Σ ' + s + ' · ' + path.length + (path.length === 1 ? ' tile' : ' tiles') : (streak > 1 ? 'streak ' + streak + ' · ' : '') + 'drag to chain';
  }
  function addCell(r, c) {
    if (r < 0 || c < 0 || r >= N || c >= N) return;
    const t = grid[r][c]; if (!t) return;
    const n = path.length;
    if (n === 0) { path.push(t); renderPath(); sfx.step(0); return; }
    const last = path[n - 1];
    if (t === last) return;
    if (n >= 2 && t === path[n - 2]) { path.pop(); renderPath(); sfx.step(path.length - 1); return; }
    if (path.includes(t)) return;
    if (Math.max(Math.abs(t.r - last.r), Math.abs(t.c - last.c)) !== 1) return;
    path.push(t); renderPath();
    const s = pathSum();
    if (s > T) sfx.over(); else if (s === T) sfx.hit(path.length); else sfx.step(path.length - 1);
  }
  function toCell(e) {
    const rc = stage.getBoundingClientRect();
    return { x: (e.clientX - rc.left) / rc.width * N, y: (e.clientY - rc.top) / rc.height * N };
  }
  function probe(x, y, first) {
    const c = Math.floor(x), r = Math.floor(y);
    if (!first) { const dx = x - (c + 0.5), dy = y - (r + 0.5); if (dx * dx + dy * dy > 0.42 * 0.42) return; }
    addCell(r, c);
  }

  stage.addEventListener('pointerdown', e => {
    if (state !== 'play' || dragging) return;
    audio();
    e.preventDefault();
    dragging = true; pointerId = e.pointerId;
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    clearHint(); idle = 0;
    path = []; const p = toCell(e); lastPt = p; probe(p.x, p.y, true);
  });
  stage.addEventListener('pointermove', e => {
    if (!dragging || e.pointerId !== pointerId) return;
    const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    (list.length ? list : [e]).forEach(ev => {
      const p = toCell(ev), dx = p.x - lastPt.x, dy = p.y - lastPt.y;
      const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 0.2));
      for (let i = 1; i <= steps; i++) probe(lastPt.x + dx * i / steps, lastPt.y + dy * i / steps, false);
      lastPt = p;
    });
  });
  const release = e => { if (dragging && (!e || e.pointerId === pointerId)) endDrag(e && e.type === 'pointercancel'); };
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);
  stage.addEventListener('lostpointercapture', release);

  function endDrag(cancelled) {
    dragging = false; pointerId = null;
    const s = pathSum(), n = path.length;
    if (!cancelled && state === 'play' && n >= 2 && s === T) resolveClear();
    else { if (!cancelled && state === 'play' && n >= 2) miss(); path = []; renderPath(); }
    if (state === 'play' && time <= 0) gameOver();
    clutch = false;
  }
  function miss() {
    combo = 0; lastClearAt = -99; streak = 0;
    board.classList.remove('shake'); void board.offsetWidth; board.classList.add('shake');
    sfx.miss(); buzz(30);
  }

  /* ---------- scoring ---------- */
  function pop(text, r, c, cls) {
    const el = document.createElement('div');
    el.className = 'pop' + (cls ? ' ' + cls : '');
    el.textContent = text;
    el.style.left = Math.min(86, Math.max(14, (c + 0.5) / N * 100)) + '%'; el.style.top = ((r + 0.5) / N * 100) + '%';
    el.addEventListener('animationend', () => el.remove());
    pops.appendChild(el);
  }
  function toast(title, sub) {
    pops.querySelectorAll('.toast').forEach(e => e.remove());
    const el = document.createElement('div'); el.className = 'toast';
    el.innerHTML = '<b></b><span></span>'; el.firstChild.textContent = title; el.lastChild.textContent = sub;
    el.addEventListener('animationend', () => el.remove());
    pops.appendChild(el);
  }
  function resolveClear() {
    const L = path.length, wasClutch = time <= 0;
    combo = (gameTime - lastClearAt <= COMBO_WIN) ? combo + 1 : 1;
    lastClearAt = gameTime; bestCombo = Math.max(bestCombo, combo);
    const golds = path.filter(t => t.k === 'gold').length;
    const pts = Math.round(T * L * L * 0.5 * comboMult(combo) * Math.pow(2, golds));
    streak++; bestStreak = Math.max(bestStreak, streak);
    const gain = L + Math.max(0, L - 3) + Math.min(3, 0.5 * (combo - 1)) + Math.min(2, 0.25 * (streak - 1));
    earned += gain;
    time = Math.min(MAX_T, time + gain);
    score += pts; clears++; cells += L; maxChain = Math.max(maxChain, L);
    const end = path[L - 1];
    pop('+' + fmt(pts), end.r, end.c);
    pop('+' + (+gain.toFixed(1)) + 's', end.r < N - 1 ? end.r + 1 : end.r - 1, end.c, 't');
    const word = wasClutch ? 'CLUTCH' : L >= 9 ? 'SINGULARITY' : L >= 7 ? 'COMPRESSED' : L >= 5 ? 'DENSE' : '';
    if (word) pop(word, 1, 2.5, 'word');
    path.forEach(t => { grid[t.r][t.c] = null; t.el.classList.add('gone'); const el = t.el; setTimeout(() => el.remove(), 280); });
    path = []; renderPath();
    sfx.clear(L, combo); buzz(L >= 5 ? [15, 30, 15] : 12);
    gravity();
    if (clears % LEVEL_CLEARS === 0) levelUp();
    ensureSolvable();
    idle = 0; hintDone = false;
    hud();
  }
  function levelUp() {
    level++;
    const span = Math.min(2 * (level - 1), 14);
    let nt = 10 + Math.floor(rng() * (span + 1));
    if (nt === T) nt = 10 + Math.floor(rng() * (span + 1));
    T = nt;
    time = Math.min(MAX_T, time + LEVEL_BONUS);
    const tg = $('target'); tg.classList.add('bump'); setTimeout(() => tg.classList.remove('bump'), 260);
    toast('Level ' + level, 'sum to ' + T + ' · +' + LEVEL_BONUS + 's · drain ×' + drain().toFixed(2));
    sfx.level();
  }

  /* ---------- HUD ---------- */
  function hud() {
    $('target').textContent = T;
    $('lvl').textContent = level;
    $('pips').querySelectorAll('i').forEach((p, i) => p.classList.toggle('on', i < clears % LEVEL_CLEARS));
    $('best').textContent = fmt(Math.max(store.get(bestKey(), 0), state === 'play' ? score : 0));
    $('bestlbl').textContent = mode === 'daily' ? 'Daily best' : 'Best';
  }
  let heatC = -1;
  function setHeat(c) {
    if (c === heatC) return; heatC = c;
    const hue = (38 - (c - 1) * 22 + 360) % 360;
    document.documentElement.style.setProperty('--pc', c > 1 ? 'hsl(' + hue + ' 95% 68%)' : 'var(--accent)');
    $('app').style.setProperty('--heat', Math.min(c, 6) / 6);
  }

  /* ---------- loop ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (state === 'play') {
      gameTime += dt;
      time -= dt * drain();
      if (time <= 0) { time = 0; if (dragging) clutch = true; else gameOver(); }
      const whole = Math.ceil(time);
      if (state === 'play' && time > 0 && time < 5 && whole !== lastTick) { lastTick = whole; sfx.tick(); }
      if (time >= 5) lastTick = 99;
      if (!dragging && state === 'play') {
        idle += dt;
        if (idle > HINT_AFTER && !hintDone) {
          hintDone = true; hint = findPath(T);
          if (hint && hint !== 'unknown') hint.slice(0, 2).forEach(t => t.el.classList.add('hint'));
        }
      }
    }
    // combo decay
    const left = combo > 0 ? Math.max(0, COMBO_WIN - (gameTime - lastClearAt)) : 0;
    if (left <= 0 && combo > 0 && state === 'play') combo = 0;
    $('cfill').style.transform = 'scaleX(' + (left / COMBO_WIN).toFixed(3) + ')';
    $('combo').textContent = '×' + comboMult(combo).toFixed(2).replace(/\.?0+$/, '');
    setHeat(combo);
    // time
    $('timefill').style.transform = 'scaleX(' + (time / MAX_T).toFixed(4) + ')';
    $('timetxt').textContent = time.toFixed(1);
    const low = state === 'play' && time < 5; $('bar').classList.toggle('low', low); $('timerow').classList.toggle('low', low);
    // score count-up
    if (shownScore !== score) { shownScore += (score - shownScore) * Math.min(1, dt * 14); if (Math.abs(score - shownScore) < 1) shownScore = score; $('score').textContent = fmt(shownScore); }
    requestAnimationFrame(frame);
  }

  /* ---------- flow ---------- */
  function newGame(m) {
    audio();
    mode = m;
    rng = mulberry32(m === 'daily' ? (Math.imul(dayKey(), 2654435761) >>> 0) : ((Math.random() * 4294967296) >>> 0));
    T = 10; level = 1; clears = 0; score = 0; shownScore = 0; $('score').textContent = '0';
    time = START_T; combo = 0; bestCombo = 0; lastClearAt = -99; gameTime = 0; maxChain = 0; cells = 0; streak = 0; bestStreak = 0; earned = 0;
    idle = 0; hint = null; hintDone = false; path = []; dragging = false; clutch = false; lastTick = 99;
    pops.innerHTML = '';
    buildBoard(true);
    ensureSolvable();
    renderPath();
    state = 'play';
    ov.hidden = true;
    hud();
    sfx.level();
  }
  function gameOver() {
    state = 'over';
    dragging = false; path = []; renderPath(); clearHint();
    const key = bestKey(), prev = store.get(key, 0), pb = score > prev;
    if (pb) store.set(key, score);
    if (score > store.get('best:all', 0)) store.set('best:all', score);
    store.set('plays', store.get('plays', 0) + 1);
    if (maxChain > store.get('chain', 0)) store.set('chain', maxChain);
    sfx.over_();
    const ppc = clears ? score / clears : 0;
    let delta;
    if (pb && prev > 0) delta = '<div class="delta pb">New best · +' + fmt(score - prev) + ' over ' + fmt(prev) + '</div>';
    else if (pb) delta = '<div class="delta pb">First score on the board</div>';
    else delta = '<div class="delta">' + fmt(prev - score) + ' short of best (' + fmt(prev) + ')</div>';
    card.innerHTML =
      '<h2>' + (mode === 'daily' ? 'Daily · ' + dayLabel() : 'Out of time') + '</h2>' +
      '<div class="big">' + fmt(score) + '</div>' + delta +
      '<dl class="res">' +
        row('Clears', clears) + row('Longest chain', maxChain) +
        row('Level', level) + row('Best combo', '×' + comboMult(bestCombo).toFixed(2).replace(/\.?0+$/, '')) +
        row('Tiles', cells) + row('Pts / clear', fmt(ppc)) +
        row('Best streak', bestStreak) + row('Time earned', Math.round(earned) + ' s') +
      '</dl>' +
      '<div class="btns"><button class="btn main" id="again" type="button">Again</button><button class="btn" id="other" type="button">' + (mode === 'daily' ? 'Endless' : 'Daily seed') + '</button></div>' +
      '<p class="meta">Space or Enter: again · R: restart mid-run</p>';
    $('again').onclick = () => newGame(mode);
    $('other').onclick = () => newGame(mode === 'daily' ? 'endless' : 'daily');
    ov.hidden = false;
    hud();
    $('again').focus({ preventScroll: true });
  }
  function row(k, v) { return '<div><dt>' + k + '</dt><dd>' + v + '</dd></div>'; }
  function menu() {
    state = 'menu';
    const best = store.get('best:all', 0), plays = store.get('plays', 0), chain = store.get('chain', 0), daily = store.get('best:daily:' + dayKey(), 0);
    card.innerHTML =
      '<h1>Sum<em>fall</em></h1>' +
      '<p class="rule">Drag through touching tiles, diagonals included, until they add up to the target. Let go to clear them.</p>' +
      '<dl class="facts">' +
        '<dt>Score</dt><dd>target × chain² ÷ 2. Long chains pay most.</dd>' +
        '<dt>Time</dt><dd>Earned only by play. +1 s per tile, +1 s more per tile past 3, +10 s each level. Drains faster each level.</dd>' +
        '<dt>Combo</dt><dd>Clear again within 3.5 s: +0.25× points (max ×4) and +0.5 s (max +3 s).</dd>' +
        '<dt class="g">×2</dt><dd>Gold tile doubles that clear.</dd>' +
        '<dt>Streak</dt><dd>Clears in a row without a wrong release: +0.25 s each, up to +2 s.</dd>' +
        '<dt>0.0 s</dt><dd>Still dragging at zero? Land the sum to survive.</dd>' +
      '</dl>' +
      '<div class="btns"><button class="btn main" id="play" type="button">Play</button><button class="btn" id="daily" type="button">Daily seed</button></div>' +
      '<p class="meta">Best ' + fmt(best) + ' · Longest chain ' + chain + ' · Runs ' + plays + '<br>Daily ' + dayLabel() + ': ' + (daily ? fmt(daily) : 'not played') + ' · Same board for everyone today<br>Space: play · P: pause · R: restart · M: sound</p>';
    $('play').onclick = () => newGame('endless');
    $('daily').onclick = () => newGame('daily');
    ov.hidden = false;
  }
  function pause() {
    if (state !== 'play') return;
    if (dragging) { path = []; endDrag(true); if (state !== 'play') return; }
    state = 'paused';
    card.innerHTML = '<h2>Paused</h2><div class="big">' + fmt(score) + '</div><p class="meta">' + time.toFixed(1) + ' s left · level ' + level + ' · sum to ' + T + '</p>' +
      '<div class="btns"><button class="btn main" id="resume" type="button">Resume</button><button class="btn" id="quit" type="button">Restart</button></div>';
    $('resume').onclick = resume;
    $('quit').onclick = () => newGame(mode);
    ov.hidden = false;
    $('resume').focus({ preventScroll: true });
  }
  function resume() { if (state !== 'paused') return; audio(); state = 'play'; ov.hidden = true; last = performance.now(); }

  /* ---------- controls ---------- */
  function setMute(m) { muted = m; store.set('muted', m); $('mute').textContent = m ? 'Sound off' : 'Sound on'; }
  $('mute').addEventListener('click', e => { audio(); setMute(!muted); e.currentTarget.blur(); });
  setMute(muted);
  document.addEventListener('keydown', e => {
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'm') { audio(); setMute(!muted); return; }
    if (k === 'p' || k === 'escape') { if (state === 'play') pause(); else if (state === 'paused') resume(); return; }
    if (k === 'r' && (state === 'play' || state === 'paused' || state === 'over')) { e.preventDefault(); newGame(mode); return; }
    if ((k === ' ' || k === 'enter') && !(e.target instanceof HTMLButtonElement)) {
      e.preventDefault();
      if (state === 'menu') newGame('endless');
      else if (state === 'over') newGame(mode);
      else if (state === 'paused') resume();
    }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('blur', () => { if (state === 'play' && !dragging) pause(); });

  /* ---------- boot ---------- */
  buildBoard(false);
  hud();
  menu();
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
