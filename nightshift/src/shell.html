<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>NIGHTSHIFT</title>
<style>
:root{--fg:#ece5d8;--dim:#8d867a;--acc:#ffb35c;--gold:#ffd86a;--bad:#ff4d5e;--ok:#8dffb0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;color:var(--fg);font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
.hide{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none;padding:max(12px,env(safe-area-inset-top)) 16px 0;transition:opacity .3s}
#hl{position:absolute;left:16px;top:max(12px,env(safe-area-inset-top))}
#score{font-size:30px;font-weight:700;letter-spacing:.04em;text-shadow:0 0 14px #000,0 0 4px #000}
#mult{font-size:20px;color:var(--acc);font-weight:700;display:inline-block;text-shadow:0 0 12px #ff8a2a88}
#mult.pop{animation:pop .3s ease-out}
#cbar{width:90px;height:3px;background:#ffffff18;margin-top:4px}
#cbar i{display:block;height:100%;width:0;background:var(--acc)}
#hc{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);text-align:center;width:min(46vw,320px)}
#wname{font-size:11px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wbar{height:3px;background:#ffffff14;margin-top:6px;position:relative}
#wbar i{display:block;height:100%;width:0;background:var(--fg);opacity:.7}
#bbar{height:2px;background:#ffffff0c;margin-top:5px;position:relative}
#bbar i{display:block;height:100%;width:0;background:var(--gold)}
#bbar b{position:absolute;right:0;top:4px;font-size:9px;letter-spacing:.2em;color:var(--gold);font-weight:400;opacity:.8}
#hr{position:absolute;right:16px;top:max(14px,env(safe-area-inset-top));text-align:right}
#emb{font-size:18px;color:var(--acc);text-shadow:0 0 10px #ff8a2a66}
#shd{font-size:12px;color:var(--fg);opacity:.75;margin-top:2px}
@keyframes pop{0%{transform:scale(1.8)}100%{transform:scale(1)}}
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;pointer-events:none;opacity:0}
#banner.on{animation:ban 2.2s ease-out forwards}
#banner .b1{font-size:clamp(28px,8vw,56px);font-weight:700;letter-spacing:.35em;text-shadow:0 0 30px currentColor}
#banner .b2{font-size:13px;letter-spacing:.5em;color:var(--dim);text-transform:uppercase;margin-top:6px}
@keyframes ban{0%{opacity:0;transform:scale(1.4);filter:blur(8px)}12%{opacity:1;transform:scale(1);filter:blur(0)}75%{opacity:1}100%{opacity:0;transform:scale(.96)}}
#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center;width:calc(100% - 32px)}
.t{background:#0d0b09ee;border:1px solid var(--ok);color:var(--ok);padding:8px 14px;font-size:13px;letter-spacing:.05em;animation:tst 2.6s forwards;max-width:100%;text-align:center}
@keyframes tst{0%{opacity:0;transform:translateY(16px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;background:radial-gradient(ellipse at center,#0000 0%,#000a 55%,#000e 100%);padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));overflow-y:auto;text-align:center}
.panel>*{max-width:440px;width:100%;flex-shrink:0}
.panel>:first-child{margin-top:auto}.panel>:last-child{margin-bottom:auto}
.title{font-size:clamp(40px,12vw,76px);font-weight:700;letter-spacing:.18em;line-height:1;text-shadow:0 0 40px #ff9a3c55;margin-right:-.18em}
.title span{color:var(--acc)}
.sub{color:var(--dim);letter-spacing:.25em;font-size:11px;text-transform:uppercase}
button{font:inherit;color:var(--fg);background:#ffffff0a;border:1px solid #ffffff2a;padding:10px 14px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border-radius:2px;font-size:12px;transition:background .15s,border-color .15s}
button:hover{background:#ffffff18;border-color:#ffffff55}
button:active{transform:translateY(1px)}
button:disabled{opacity:.35;cursor:default}
button.big{font-size:20px;padding:14px 20px;border-color:var(--acc);color:var(--acc);box-shadow:0 0 30px #ffb35c22,inset 0 0 20px #ffb35c11;font-weight:700}
button.big small{font-size:10px;opacity:.6;font-weight:400}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row button{flex:1 1 0;min-width:0}
.rank{font-size:12px;letter-spacing:.12em;color:var(--dim)}
.rank b{color:var(--fg);font-weight:700}
.xp{height:4px;background:#ffffff14;margin-top:6px;overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.stats{display:flex;justify-content:center;gap:18px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.stats b{color:var(--fg)}
.stats .e{color:var(--acc)}
.missions{display:flex;flex-direction:column;gap:6px;text-align:left}
.mh{font-size:10px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
.m{border:1px solid #ffffff1c;background:#0008;padding:8px 10px;font-size:12px;position:relative;overflow:hidden}
.m .r{float:right;color:var(--acc)}
.m .pb{height:2px;background:#ffffff14;margin-top:6px}
.m .pb i{display:block;height:100%;background:var(--fg);transition:width 1s ease-out}
.m.done{border-color:var(--ok);color:var(--ok)}
.m.done .pb i{background:var(--ok)}
.m.done:after{content:"✓";position:absolute;right:10px;bottom:3px;font-size:11px}
.help{font-size:11px;color:var(--dim);letter-spacing:.08em}
.otitle{font-size:12px;letter-spacing:.5em;color:var(--bad);text-transform:uppercase}
.oscore{font-size:clamp(48px,15vw,84px);font-weight:700;line-height:1;letter-spacing:.02em}
.obest{font-size:12px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.obest.nb{color:var(--gold);animation:glow 1s infinite alternate}
@keyframes glow{to{text-shadow:0 0 18px var(--gold)}}
.near{color:var(--acc);font-size:13px;min-height:1em;display:flex;flex-direction:column;gap:3px}
.rewards{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:12px}
.rewards span{border:1px solid #ffb35c44;color:var(--acc);padding:4px 8px}
#rev{border:1px solid var(--gold);padding:12px;background:#1a1206cc}
#rev button{width:100%;border-color:var(--gold);color:var(--gold);font-size:16px;font-weight:700}
#rev .cd{height:3px;background:var(--gold);margin-top:8px;transform-origin:left}
#rev p{font-size:11px;color:var(--dim);margin-bottom:8px;letter-spacing:.1em}
.shop{display:flex;flex-direction:column;gap:8px;text-align:left}
.it{display:flex;align-items:center;gap:10px;border:1px solid #ffffff1c;background:#0009;padding:10px}
.it .d{flex:1;min-width:0}
.it .n{font-weight:700;letter-spacing:.08em}
.it .s{font-size:11px;color:var(--dim)}
.it .pips{font-size:10px;color:var(--acc);letter-spacing:.2em}
.it button{white-space:nowrap;color:var(--acc);border-color:#ffb35c66}
.cols{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid #ffffff22;position:relative;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;font-size:9px;padding-bottom:2px;color:#000;font-weight:700;text-shadow:0 0 3px #000,0 0 3px #000}
.sw.eq{border-color:#fff;box-shadow:0 0 16px currentColor}
.sw.lk{filter:grayscale(.8) brightness(.45)}
#pause{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:.4em;background:#0008;text-transform:uppercase}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--dim)}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<div id="hud" class="hide">
  <div id="hl"><div id="score">0</div><div id="mult">×1</div><div id="cbar"><i></i></div></div>
  <div id="hc"><div id="wname"></div><div id="wbar"><i></i></div><div id="bbar"><i></i><b>BEST</b></div></div>
  <div id="hr"><div id="emb">✦ 0</div><div id="shd"></div></div>
</div>
<div id="banner"><div class="b1"></div><div class="b2"></div></div>
<div id="toast"></div>

<div id="menu" class="panel">
  <div class="title">NIGHT<span>SHIFT</span></div>
  <div class="sub">carry the light down through the wards</div>
  <div id="mRank"></div>
  <button id="bPlay" class="big">Begin shift <small>[space]</small></button>
  <div class="row"><button id="bWard"></button><button id="bDaily"></button><button id="bShop">Upgrades</button></div>
  <div class="stats" id="mStats"></div>
  <div class="missions" id="mList"></div>
  <div class="help">← → / A D · touch: hold left or right half · skim walls to graze</div>
  <div class="row"><button id="bMute"></button></div>
</div>

<div id="over" class="panel hide">
  <div class="otitle" id="oTitle">the light goes out</div>
  <div class="oscore" id="oScore">0</div>
  <div class="obest" id="oBest"></div>
  <div class="near" id="oNear"></div>
  <div id="rev" class="hide"><p>THE DARK HESITATES</p><button id="bRev"></button><div class="cd" id="revCd"></div></div>
  <div id="oPost">
    <div class="rewards" id="oRew"></div>
    <div id="oRank" style="margin-top:12px"></div>
    <div class="missions" id="oMis" style="margin-top:12px"></div>
  </div>
  <button id="bRetry" class="big">Again <small>[space]</small></button>
  <div class="row"><button id="bShop2">Upgrades</button><button id="bMenu">Menu</button></div>
</div>

<div id="shop" class="panel hide">
  <div class="title" style="font-size:32px">UPGRADES</div>
  <div class="stats"><span class="e" id="sEmb"></span></div>
  <div class="shop" id="sList"></div>
  <div class="mh">lantern</div>
  <div class="cols" id="cList"></div>
  <button id="bBack">Back</button>
</div>
<div id="pause" class="hide">paused · press to resume</div>
<script>
/*GAME*/
</script>
</body>
</html>
