<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Night Shift</title>
<style>
:root{color-scheme:dark;--ink:#e9e1d3;--dim:#8d8378;--acc:#ffb347;--red:#ff4a3d;--grn:#7dff6a;--bg:#050307;--card:#130f17;--line:#2d2433}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden;color:var(--ink);font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block;position:fixed;inset:0}
#ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:20px 16px;overflow:auto;background:radial-gradient(ellipse at center,rgba(5,3,8,.55),rgba(5,3,8,.92))}
#ov.on{display:flex}#ov>:first-child{margin-top:auto}#ov>:last-child{margin-bottom:auto}
#pz{position:fixed;top:14px;left:50%;margin-left:-90px;width:30px;height:30px;border-radius:50%;border:1px solid #3a2e3f;background:#0008;color:#bbb;font:12px monospace;display:none;cursor:pointer}#pz.on{display:block}
#ov.clear{background:radial-gradient(ellipse at center,rgba(5,3,8,0),rgba(5,3,8,.75))}
h1{font:400 clamp(40px,10vw,92px) Georgia,serif;letter-spacing:.3em;margin-right:-.3em;text-shadow:0 0 30px #c2410c,0 0 2px #fff;text-align:center}
h2{font:400 clamp(28px,6vw,48px) Georgia,serif;letter-spacing:.2em;text-align:center;text-shadow:0 0 20px #c2410c}
.sub{color:var(--dim);font-family:Georgia,serif;font-style:italic;text-align:center;max-width:34em}
.row{width:100%;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:stretch}
.btn{background:#1d1620;border:1px solid #3a2e3f;color:var(--ink);padding:12px 22px;border-radius:8px;font:inherit;font-weight:700;letter-spacing:.1em;cursor:pointer;transition:transform .1s,border-color .1s}
.btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(#ffb347,#d9661c);color:#1a0d02;border:none;box-shadow:0 0 24px #ff8a2a55}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.k{opacity:.55;font-weight:400;font-size:11px;margin-left:6px}
.card{position:relative;width:min(220px,100%);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s;animation:pop .35s both;text-align:left}
.card:hover,.card.sel{transform:translateY(-4px);border-color:var(--acc);box-shadow:0 0 26px #ffb34744}
.card.evo{border-color:#ff5ad1;box-shadow:0 0 26px #ff5ad155}
.card.lock{opacity:.45;cursor:default}
.card.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset,0 0 26px #ffb34744}
.ic{font-size:32px;line-height:1.1}
.nm{font-weight:700;color:#fff;margin:6px 0 2px;font-size:15px}
.tg{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;background:#ffb34722;color:var(--acc);letter-spacing:.08em;margin-bottom:6px}
.tg.n{background:#7dff6a22;color:var(--grn)}
.tg.e{background:#ff5ad122;color:#ff8ae0}
.ds{color:#bdb3a6;font-size:12.5px}
.ds b{color:#fff;font-weight:600}
.hint{margin-top:8px;font-size:11px;color:#ff8ae0;opacity:.85}
.num{position:absolute;top:8px;right:10px;font-size:11px;color:var(--dim)}
.pips{display:flex;gap:3px;margin-top:8px}.pips i{width:14px;height:4px;border-radius:2px;background:#2d2433}.pips i.f{background:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;width:min(560px,100%)}
.st{background:#130f17;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}.st b{display:block;font-size:20px;color:#fff}.st span{font-size:11px;color:var(--dim);letter-spacing:.08em}
.goal{width:min(560px,100%);background:#130f17;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px}
.bar{height:6px;background:#2d2433;border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#d9661c,#ffb347)}
.ash{color:var(--acc);font-weight:700}
.rec{color:var(--grn);font-weight:700;letter-spacing:.15em;animation:pulse 1s infinite alternate}
.unl{color:#ff8ae0;font-weight:700;letter-spacing:.1em;animation:pulse .7s infinite alternate}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;width:min(900px,100%)}
.shop .card{width:auto}
.chest{font-size:72px;filter:drop-shadow(0 0 30px #ffb347);animation:shake .1s infinite}
.reel{display:flex;gap:10px;font-size:40px;min-height:56px}
.reel span{animation:pop .3s both}
.small{font-size:11px;color:var(--dim);text-align:center}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.94)}}
@keyframes pulse{to{opacity:.55}}
@keyframes shake{0%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@media (max-width:520px){.card{width:calc(50% - 5px);padding:10px}.ic{font-size:24px}.ds{font-size:11.5px}.nm{font-size:13px}.hint{font-size:10px}h1{letter-spacing:.18em;margin-right:-.18em}.btn{padding:11px 16px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov"></div><button id="pz" aria-label="pause">II</button>
<script>
'use strict';
(()=>{
const $=s=>document.querySelector(s),R=Math.random,TAU=Math.PI*2,hyp=Math.hypot;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const C=$('#c'),X=C.getContext('2d'),OV=$('#ov');
const DK=document.createElement('canvas'),DX=DK.getContext('2d');
let W=0,H=0,DPR=1,Z=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;C.width=W*DPR|0;C.height=H*DPR|0;C.style.width=W+'px';C.style.height=H+'px';DK.width=Math.ceil(W/2);DK.height=Math.ceil(H/2);Z=clamp(Math.min(W,H)/760,.6,1.35)}
addEventListener('resize',resize);resize();

/* ---------- save ---------- */
const SKEY='nightshift.v1';let S=null;
try{S=JSON.parse(localStorage.getItem(SKEY))}catch(e){}
S=Object.assign({ash:0,best:0,runs:0,kills:0,bestKills:0,bestLvl:0,boss:0,dawn:0,up:{},chars:{nurse:1},char:'nurse',mute:0,seen:{}},S||{});
const save=()=>{try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}};

/* ---------- sprites ---------- */
function mk(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hh(x,y){let h=Math.imul(x,374761393)+Math.imul(y,668265263)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296}
const LIGHT=mk(128,128,c=>{const q=c.createRadialGradient(64,64,0,64,64,64);q.addColorStop(0,'rgba(0,0,0,1)');q.addColorStop(.5,'rgba(0,0,0,.88)');q.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=q;c.fillRect(0,0,128,128)});
const GL={};
function glow(rgb){return GL[rgb]||(GL[rgb]=mk(64,64,c=>{const q=c.createRadialGradient(32,32,0,32,32,32);q.addColorStop(0,'rgba(255,255,255,1)');q.addColorStop(.14,`rgba(${rgb},1)`);q.addColorStop(.4,`rgba(${rgb},.28)`);q.addColorStop(1,`rgba(${rgb},0)`);c.fillStyle=q;c.fillRect(0,0,64,64)}))}
function blob(rgb,seed){return mk(96,96,c=>{const r=rng(seed);
  for(let i=0;i<22;i++){const a=r()*TAU,d=r()*18,x=48+Math.cos(a)*d,y=48+Math.sin(a)*d,rr=10+r()*16,q=c.createRadialGradient(x,y,0,x,y,rr);q.addColorStop(0,`rgba(${rgb},.6)`);q.addColorStop(1,`rgba(${rgb},0)`);c.fillStyle=q;c.fillRect(0,0,96,96)}
  c.strokeStyle=`rgba(${rgb},.85)`;c.lineCap='round';
  for(let i=0;i<8;i++){const a=r()*TAU,l=28+r()*14;c.lineWidth=2+r()*2;c.beginPath();c.moveTo(48,48);c.quadraticCurveTo(48+Math.cos(a+.6)*22,48+Math.sin(a+.6)*22,48+Math.cos(a)*l,48+Math.sin(a)*l);c.stroke()}
  c.fillStyle=`rgb(${rgb})`;c.beginPath();c.arc(48,48,17,0,TAU);c.fill()})}
const SHE=mk(120,200,c=>{const r=rng(13);
  const q=c.createLinearGradient(0,40,0,200);q.addColorStop(0,'rgba(14,11,16,1)');q.addColorStop(1,'rgba(14,11,16,0)');c.fillStyle=q;
  c.beginPath();c.moveTo(60,30);c.bezierCurveTo(22,80,12,150,2,200);c.lineTo(118,200);c.bezierCurveTo(108,150,98,80,60,30);c.fill();
  c.strokeStyle='rgba(22,18,26,1)';c.lineWidth=4;c.lineCap='round';c.beginPath();c.moveTo(46,52);c.quadraticCurveTo(16,92,22,138);c.moveTo(74,52);c.quadraticCurveTo(104,92,98,138);c.stroke();
  c.lineWidth=1.5;for(let i=0;i<46;i++){const a=-1.3+r()*2.6;c.strokeStyle=`rgba(4,3,5,${.6+r()*.4})`;c.beginPath();c.moveTo(60+r()*12-6,16);c.quadraticCurveTo(60+Math.sin(a)*30,58,60+Math.sin(a)*(18+r()*26),70+r()*70);c.stroke()}
  c.fillStyle='#070609';c.beginPath();c.ellipse(60,26,15,19,0,0,TAU);c.fill()});
const FLOOR=mk(256,256,c=>{const r=rng(7);
  for(let y=0;y<8;y++)for(let x=0;x<8;x++){const b=((x+y)&1)?44:33,j=r()*6-3;c.fillStyle=`rgb(${b+j-7|0},${b+j+5|0},${b+j-1|0})`;c.fillRect(x*32,y*32,32,32)}
  for(let i=0;i<16;i++){const x=r()*256,y=r()*256,rr=12+r()*40;for(const ox of[-256,0,256])for(const oy of[-256,0,256]){const q=c.createRadialGradient(x+ox,y+oy,0,x+ox,y+oy,rr);q.addColorStop(0,'rgba(24,16,6,.3)');q.addColorStop(1,'rgba(24,16,6,0)');c.fillStyle=q;c.fillRect(x+ox-rr,y+oy-rr,rr*2,rr*2)}}
  for(let i=0;i<3200;i++){c.fillStyle=`rgba(${r()<.5?0:70},${r()<.5?0:50},10,${r()*.12})`;const s=r()*2.5;c.fillRect(r()*256,r()*256,s,s)}
  c.fillStyle='rgba(0,0,0,.4)';for(let i=0;i<8;i++){c.fillRect(i*32,0,1.5,256);c.fillRect(0,i*32,256,1.5)}
  c.strokeStyle='rgba(0,0,0,.45)';c.lineWidth=1;for(let i=0;i<6;i++){let x=20+r()*216,y=20+r()*216;c.beginPath();c.moveTo(x,y);for(let k=0;k<6;k++){x+=r()*16-8;y+=r()*16-8;c.lineTo(x,y)}c.stroke()}});
const FP=X.createPattern(FLOOR,'repeat');
const GRAIN=mk(160,160,c=>{const d=c.createImageData(160,160);for(let i=0;i<d.data.length;i+=4){const v=R()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=R()*40}c.putImageData(d,0,0)});
const GP=X.createPattern(GRAIN,'repeat');
const DEC=[
  mk(120,90,c=>{const r=rng(3);for(let i=0;i<9;i++){const x=40+r()*40,y=30+r()*30,rr=6+r()*22;c.fillStyle=`rgba(${70+r()*30|0},8,10,${.3+r()*.3})`;c.beginPath();c.ellipse(x,y,rr,rr*.7,r()*3,0,TAU);c.fill()}for(let i=0;i<14;i++){c.beginPath();c.arc(r()*120,r()*90,r()*3,0,TAU);c.fill()}}),
  mk(64,64,c=>{const q=c.createRadialGradient(32,32,8,32,32,32);q.addColorStop(0,'rgba(10,8,4,.5)');q.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=q;c.fillRect(0,0,64,64);c.fillStyle='#1b1f1d';c.beginPath();c.arc(32,32,15,0,TAU);c.fill();c.strokeStyle='#070908';c.lineWidth=2;for(let i=-9;i<=9;i+=6){c.beginPath();c.moveTo(22,32+i);c.lineTo(42,32+i);c.stroke()}}),
  mk(60,60,c=>{const r=rng(9);for(let i=0;i<4;i++){c.save();c.translate(15+r()*30,15+r()*30);c.rotate(r()*6);c.fillStyle=`rgba(200,195,170,${.45+r()*.3})`;c.fillRect(-8,-11,16,22);c.fillStyle='rgba(40,40,60,.4)';for(let k=0;k<5;k++)c.fillRect(-6,-8+k*4,10*r()+2,1);c.restore()}}),
  mk(140,80,c=>{c.fillStyle='rgba(0,0,0,.4)';c.fillRect(16,20,120,52);c.fillStyle='#5d615c';c.fillRect(8,10,120,50);c.fillStyle='#9d9d92';c.fillRect(12,14,112,42);c.fillStyle='#c4c1b2';c.fillRect(14,18,26,34);c.fillStyle='rgba(110,10,12,.55)';c.beginPath();c.ellipse(82,36,22,11,.3,0,TAU);c.fill();c.strokeStyle='#333632';c.lineWidth=3;c.strokeRect(8,10,120,50)}),
  mk(90,90,c=>{c.strokeStyle='rgba(120,14,14,.5)';c.lineWidth=3;c.lineCap='round';c.beginPath();c.arc(45,45,30,0,TAU);c.stroke();for(let i=0;i<9;i++){const a=i/9*TAU;c.beginPath();c.moveTo(45+Math.cos(a)*30,45+Math.sin(a)*30);c.lineTo(45+Math.cos(a+2.4)*30,45+Math.sin(a+2.4)*30);c.stroke()}}),
];

/* ---------- data ---------- */
const WEAP={
  lantern:{n:'Lantern',ic:'🏮',max:6,evo:'reach',en:'Sun Lamp',ed:'Light x1.5 wider, burns twice as hot.',d:'Every shade inside your light burns.',s:l=>({Radius:60+12*l,'Burn/s':6+5*l})},
  flare:{n:'Flare Gun',ic:'🧨',max:6,evo:'focus',en:'Phosphor Storm',ed:'Also fires a ring of 8 flares. +2 pierce.',d:'Shoots flares at the nearest shades.',s:l=>({Flares:1+(l>>1),Damage:10+5*l,Pierce:1+(l>=5?1:0)})},
  scalpels:{n:'Scalpels',ic:'🔪',max:6,evo:'haste',en:'Surgical Halo',ed:'8 blades, orbit breathes in and out.',d:'Blades orbit you, cutting what they touch.',s:l=>({Blades:Math.min(1+l,6),Damage:8+4*l+(l>=6?6:0)})},
  sigil:{n:'Sigil',ic:'✴️',max:6,evo:'fury',en:'Ninth Sigil',ed:'Echoes a second, larger blast.',d:'Periodic burst that hurls shades back.',s:l=>({Radius:80+14*l,Damage:18+9*l,Cooldown:+(3.2-.25*l).toFixed(2)})},
  arc:{n:'Arc Bulb',ic:'💡',max:6,evo:'luck',en:'Fuse Box',ed:'Two bolts, double chains, faster.',d:'Lightning that jumps between shades.',s:l=>({Chains:2+l,Damage:14+6*l,Cooldown:+(1.7-.1*l).toFixed(2)})},
  salt:{n:'Salt Circle',ic:'🧂',max:6,evo:'regen',en:'Sanctum',ed:'+2 circles, wider, shades inside crawl.',d:'Holy circles scorch shades standing in them.',s:l=>({Circles:1+Math.floor(l/3),'Dmg/s':14+6*l,Radius:36+5*l})},
};
const PAS={
  vit:{n:'Vitality',ic:'❤️',max:5,d:'+20 max HP'},
  haste:{n:'Haste',ic:'👟',max:5,d:'+8% move speed'},
  magnet:{n:'Magnet',ic:'🧲',max:5,d:'+30% pickup range'},
  focus:{n:'Focus',ic:'⏳',max:5,d:'-8% cooldowns'},
  fury:{n:'Fury',ic:'🩸',max:5,d:'+10% damage'},
  reach:{n:'Reach',ic:'🌀',max:5,d:'+10% area'},
  luck:{n:'Luck',ic:'🍀',max:5,d:'+6% crit chance (x2)'},
  regen:{n:'Regen',ic:'💉',max:5,d:'+0.4 HP/s'},
};
const SHOP=[
  {k:'hp',n:'Thick Skin',ic:'🛡️',max:5,c:30,d:'+10 max HP'},
  {k:'dmg',n:'Steady Hands',ic:'✋',max:5,c:40,d:'+5% damage'},
  {k:'xp',n:'Insight',ic:'📖',max:5,c:35,d:'+5% XP gained'},
  {k:'mag',n:'Keen Eye',ic:'👁️',max:3,c:25,d:'+15% pickup range'},
  {k:'spd',n:'Soft Shoes',ic:'🥿',max:3,c:45,d:'+4% move speed'},
  {k:'cd',n:'Night Owl',ic:'🦉',max:3,c:60,d:'-3% cooldowns'},
  {k:'luck',n:'Rabbit Foot',ic:'🐇',max:3,c:55,d:'+3% crit chance'},
  {k:'greed',n:'Greed',ic:'⚱️',max:5,c:50,d:'+10% ash earned'},
  {k:'reroll',n:'Second Opinion',ic:'🔁',max:3,c:70,d:'+1 reroll per shift'},
  {k:'rev',n:'Second Wind',ic:'🕯️',max:1,c:250,d:'Revive once per shift'},
];
const cost=(it,l)=>Math.round(it.c*Math.pow(1.6,l));
const CHARS={
  nurse:{n:'Nurse Vale',ic:'🩺',w:'lantern',hp:0,spd:1,dmg:1,cards:3,d:'Starts with the Lantern. Steady.'},
  orderly:{n:'Orderly Brann',ic:'🧹',w:'scalpels',hp:40,spd:.92,dmg:1,cards:3,d:'Scalpels. +40 HP, slower.',req:'Survive until 3:00 AM',ok:()=>S.best>=300,pr:()=>S.best/300},
  patient:{n:'Patient Nine',ic:'🎗️',w:'sigil',hp:-30,spd:1.08,dmg:1.2,cards:3,d:'Sigil. Fragile, fast, +20% damage.',req:'Put Her down once',ok:()=>S.boss>0,pr:()=>Math.min(1,S.boss)},
  doctor:{n:'The Night Doctor',ic:'🦇',w:'arc',hp:0,spd:1,dmg:1,cards:4,d:'Arc Bulb. 4 choices every level.',req:'Survive until dawn',ok:()=>S.dawn>0,pr:()=>S.best/600},
};
const ET={
  shade:{hp:9,sp:50,r:11,dmg:7,xp:1,rgb:'30,20,36',eye:'255,60,40'},
  crawler:{hp:5,sp:88,r:8,dmg:5,xp:1,rgb:'38,22,24',eye:'255,150,50'},
  brute:{hp:60,sp:32,r:20,dmg:14,xp:6,rgb:'34,15,28',eye:'255,40,110'},
  wraith:{hp:24,sp:66,r:12,dmg:10,xp:2,rgb:'20,27,44',eye:'120,240,255'},
  she:{hp:2600,sp:120,r:24,dmg:24,xp:0,rgb:'10,9,12',eye:'255,255,255'},
};
let si=1;for(const k in ET)if(k!=='she')ET[k].spr=blob(ET[k].rgb,si++*977);
const RUN=600;

/* ---------- audio ---------- */
let AC=null,MG=null,NB=null,lastHit=0,lastKill=0,nextBeat=0,beatN=0;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  const comp=AC.createDynamicsCompressor();comp.connect(AC.destination);
  MG=AC.createGain();MG.gain.value=S.mute?0:.55;MG.connect(comp);
  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;
  const o1=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
  o1.type=o2.type='sawtooth';o1.frequency.value=55;o2.frequency.value=55.6;f.type='lowpass';f.frequency.value=160;g.gain.value=.045;
  o1.connect(f);o2.connect(f);f.connect(g);g.connect(MG);o1.start();o2.start();
  const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=.06;lg.gain.value=90;l.connect(lg);lg.connect(f.frequency);l.start();
  const n=AC.createBufferSource();n.buffer=NB;n.loop=true;const nf=AC.createBiquadFilter();nf.type='bandpass';nf.frequency.value=380;nf.Q.value=.6;const ng=AC.createGain();ng.gain.value=.02;n.connect(nf);nf.connect(ng);ng.connect(MG);n.start();
}
const mute=()=>!AC||(G&&G.demo);
function tone(f,d,type,v,f2,dl,force){if(!AC||(!force&&mute()))return;const t=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.03)}
function nz(d,v,fq,q,dl,force){if(!AC||(!force&&mute()))return;const t=AC.currentTime+(dl||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type='bandpass';f.frequency.value=fq;f.Q.value=q||1;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(MG);s.start(t,R()*.5);s.stop(t+d+.03)}

function director(dt){

    if(E.k==='surge'){const n=Math.round(28+t/7),d=spawnDist()*.85,tp=t>200?'crawler':'shade';for(let i=0;i<n;i++){const a=i/n*TAU;spawn(i%3?'shade':tp,g.p.x+Math.cos(a)*d,g.p.y+Math.sin(a)*d,{fast:1})}msg('THEY CLOSE IN','',2)}
    else if(E.k==='elite'){spawn(pickType(t),undefined,undefined,{elite:1});msg('SOMETHING BIGGER','it carries a reliquary',2.2,'#ffd76a')}
    else if(E.k==='hour'){msg(clock(E.t),'',2,'#e9e1d3');sfx.chime()}

function update(dt){
  const g=G,p=g.p;if(dt<=0)return;g.t+=dt;
  let ix=0,iy=0;
  if(g.demo){for(const e of g.en){const dx=p.x-e.x,dy=p.y-e.y,d=hyp(dx,dy)||1;if(d<200){ix+=dx/d/d*60;iy+=dy/d/d*60}}
    let bg=null,bd=1e9;for(const q of g.gems){const d=hyp(q.x-p.x,q.y-p.y);if(d<bd){bd=d;bg=q}}if(bg&&bd<400){ix+=(bg.x-p.x)/bd*.5;iy+=(bg.y-p.y)/bd*.5}
    ix+=Math.cos(g.t*.25)*.35;iy+=Math.sin(g.t*.31)*.35}
  else if(mode==='play'){ix=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0);iy=(K.KeyS||K.ArrowDown?1:0)-(K.KeyW||K.ArrowUp?1:0);if(J.on){ix+=J.dx;iy+=J.dy}}
  const il=hyp(ix,iy);if(il>1){ix/=il;iy/=il}
  if(mode!=='dying'){p.x+=ix*p.spd*dt;p.y+=iy*p.spd*dt}
  if(il>.1){p.face=Math.atan2(iy,ix);p.walk+=dt*12}
  if(p.inv>0)p.inv-=dt;if(p.regen&&p.hp<p.maxHp&&p.hp>0)p.hp=Math.min(p.maxHp,p.hp+p.regen*dt);
  g.cam.x=lerp(g.cam.x,p.x,Math.min(1,dt*7));g.cam.y=lerp(g.cam.y,p.y,Math.min(1,dt*7));
  g.shake=Math.max(0,g.shake-dt*32);if(g.hurtF>0)g.hurtF-=dt;if(g.flash>0)g.flash-=dt;
  if(g.msg&&(g.msg.life-=dt)<=0)g.msg=null;
  const lw=g.wep.lantern;g.lightR=Math.max(140*Math.sqrt(p.area),lw?lanR(lw)+38:0)*(1+.025*Math.sin(g.t*11)+.018*Math.sin(g.t*27.3));
  g.darkA=g.endless?.95:.94-clamp((g.t-560)/40,0,1)*.55;
  if(mode==='play'||g.demo)director(dt);
  gridBuild();
  // enemies
  const far=hyp(W,H)/Z*.75+260;
  for(const e of g.en){if(e.dead)continue;
    const dx=p.x-e.x,dy=p.y-e.y,d=hyp(dx,dy)||1;let sp=e.sp*(e.slow>0?.45:1);if(e.slow>0)e.slow-=dt;
    if(e.type==='she'){const lit=d<g.lightR+10;sp=lit?36:132;e.lit=lit;e.blink-=dt;
      if(!lit&&e.blink<=0&&d>g.lightR+60){e.blink=5.5;const a=p.face+Math.PI+(R()-.5)*1.2,r=g.lightR+50;e.x=p.x+Math.cos(a)*r;e.y=p.y+Math.sin(a)*r;sfx.blink();g.shake=Math.max(g.shake,6);for(let i=0;i<20;i++)part(e.x,e.y,(R()-.5)*200,(R()-.5)*200,.6,'10,9,12',14,0)}}
    let mx=dx/d*sp,my=dy/d*sp;
    if(e.type==='wraith'){const w=Math.sin(g.t*3+e.ph)*.8;mx+=-dy/d*sp*w;my+=dx/d*sp*w}
    e.x+=(mx+e.kx)*dt;e.y+=(my+e.ky)*dt;const kd=Math.max(0,1-dt*9);e.kx*=kd;e.ky*=kd;if(e.flash>0)e.flash-=dt;
    if(d>far&&e.type!=='she'&&!e.elite){const a=Math.atan2(dy,dx)+(R()-.5)*1.4,sd=spawnDist();e.x=p.x+Math.cos(a)*sd;e.y=p.y+Math.sin(a)*sd}
    else if(d>far*1.6){const a=R()*TAU,sd=spawnDist();e.x=p.x+Math.cos(a)*sd;e.y=p.y+Math.sin(a)*sd}
    if(d<e.r+p.r-2)hitPlayer(e.dmg);
    // separation
    let c=0;query(e.x,e.y,e.r+20,o=>{if(o===e||o.id<e.id)return;const ox=o.x-e.x,oy=o.y-e.y,od=hyp(ox,oy),m=e.r+o.r;
      if(od<m&&od>.01){const push=(m-od)/od*.5;if(e.type==='she'){o.x+=ox*push*2;o.y+=oy*push*2}else if(o.type==='she'){e.x-=ox*push*2;e.y-=oy*push*2}else{o.x+=ox*push;o.y+=oy*push;e.x-=ox*push;e.y-=oy*push}}
      if(++c>10)return false})}
  for(const k in g.wep)WU[k](g.wep[k],dt);
  for(let i=g.delayed.length-1;i>=0;i--){const q=g.delayed[i];if((q.t-=dt)<=0){g.delayed.splice(i,1);q.f()}}
  // projectiles
  for(const b of g.pj){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(R()<.5)part(b.x,b.y,(R()-.5)*20,(R()-.5)*20,.3,'255,120,40',2,1);
    query(b.x,b.y,50,e=>{if(b.pierce<=0||b.hit.has(e.id))return;if(hyp(e.x-b.x,e.y-b.y)<e.r+6){b.hit.add(e.id);b.pierce--;hurt(e,b.dmg,70,b.x-b.vx,b.y-b.vy)}});if(b.pierce<=0)b.life=0}
  g.pj=g.pj.filter(b=>b.life>0);
  for(const z of g.zones){z.life-=dt;z.tk-=dt;if(z.tk<=0){z.tk=.25;query(z.x,z.y,z.r+30,e=>{if(hyp(e.x-z.x,e.y-z.y)<z.r+e.r){hurt(e,z.dps*.25,0,z.x,z.y,1);if(z.slow)e.slow=.4}})}}
  g.zones=g.zones.filter(z=>z.life>0);
  for(const r of g.rings)r.t+=dt;g.rings=g.rings.filter(r=>r.t<.55);
  for(const b of g.bolts)b.t+=dt;g.bolts=g.bolts.filter(b=>b.t<.16);
  for(const f of g.fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.96;f.vy*=.96;f.life-=dt}g.fx=g.fx.filter(f=>f.life>0);
  for(const t of g.txt)t.t+=dt;g.txt=g.txt.filter(t=>t.t<(t.big?1.4:.7));
  // pickups
  const mr=p.mag;
  for(const q of g.gems){const dx=p.x-q.x,dy=p.y-q.y,d=hyp(dx,dy);if(!q.m&&d<mr)q.m=true;
    if(q.m){const a=1600*dt;q.vx+=dx/d*a;q.vy+=dy/d*a;const v=hyp(q.vx,q.vy),mv=600;if(v>mv){q.vx*=mv/v;q.vy*=mv/v}q.x+=q.vx*dt;q.y+=q.vy*dt;
      if(d<p.r+8){q.dead=true;addXp(q.v);if(!g.demo){g.gemStreak=g.gemT>0?g.gemStreak+1:0;g.gemT=.4;sfx.gem(g.gemStreak)}}}}
  g.gems=g.gems.filter(q=>!q.dead);
  for(const it of g.items){it.t+=dt;const dx=p.x-it.x,dy=p.y-it.y,d=hyp(dx,dy);if(!it.m&&d<(it.type==='chest'?24:mr))it.m=true;
    if(it.m){const a=1400*dt;it.vx+=dx/d*a;it.vy+=dy/d*a;it.x+=it.vx*dt;it.y+=it.vy*dt;if(d<p.r+10){it.dead=true;pickup(it)}}}
  g.items=g.items.filter(i=>!i.dead);
  if(g.comboT>0&&(g.comboT-=dt)<=0){g.combo=0;g.comboNext=50}
  if(g.gemT>0)g.gemT-=dt;
  let j=0;for(const e of g.en)if(!e.dead)g.en[j++]=e;g.en.length=j;
  if(g.boss&&g.boss.dead)g.boss=null;
  // low hp heartbeat
  if(!g.demo&&mode==='play'&&p.hp<p.maxHp*.3){lowHeart.t-=dt;if(lowHeart.t<=0){lowHeart.t=.9;sfx.heart()}}
  if(g.demo){if(g.pending){g.pending--;const c=choices(1)[0];if(c)apply(c)}if(g.t>200){newRun(true)}return}
  if(mode==='play'){
    if(!g.dawn&&g.t>=RUN)return dawnReached();
    if(g.chestQ){g.chestQ--;return openChest()}
    if(g.pending)return openLevel();
  }
}
function addXp(v){const g=G;g.xp+=v*g.p.xpM;while(g.xp>=g.need){g.xp-=g.need;g.lvl++;g.need=needFor(g.lvl);g.pending++}}
function pickup(it){const g=G,p=g.p;
  if(it.type==='heart'){p.hp=Math.min(p.maxHp,p.hp+30);g.txt.push({x:p.x,y:p.y-30,v:'+30 ♥',cr:true,t:0});sfx.pick()}
  else if(it.type==='ash'){const a=2+(R()*4|0);g.ashRun+=a;g.txt.push({x:p.x,y:p.y-30,v:'+'+a+' ⚱',cr:true,t:0});sfx.pick()}
  else if(it.type==='vac'){for(const q of g.gems)q.m=true;sfx.pick();g.flash=.15}
  else if(it.type==='chest'){if(g.demo)return;g.chestQ++}}

/* ---------- level-up ---------- */
function choices(n){
  const g=G,o=[],wk=Object.keys(g.wep),pk=Object.keys(g.pas);
  for(const k of wk)if(g.wep[k].l<WEAP[k].max)o.push({k,t:'w',w:4});
  if(wk.length<4)for(const k in WEAP)if(!g.wep[k])o.push({k,t:'w',nw:1,w:2.2});
  for(const k of pk)if(g.pas[k]<PAS[k].max)o.push({k,t:'p',w:3});
  if(pk.length<4)for(const k in PAS)if(!g.pas[k]){let w=1.6;for(const q of wk)if(WEAP[q].evo===k)w+=1.4;o.push({k,t:'p',nw:1,w})}
  const out=[];while(out.length<n&&o.length){let s=0;for(const v of o)s+=v.w;let r=R()*s,i=0;for(;i<o.length-1;i++)if((r-=o[i].w)<0)break;out.push(o.splice(i,1)[0])}
  if(!out.length){out.push({t:'heal'});if(n>1)out.push({t:'ash'})}
  return out;
}
function apply(c){const g=G;
  if(c.t==='w'){if(g.wep[c.k])g.wep[c.k].l++;else g.wep[c.k]={l:1,cd:0,evo:false,a:0}}
  else if(c.t==='p'){g.pas[c.k]=(g.pas[c.k]||0)+1}
  else if(c.t==='heal'){g.p.hp=Math.min(g.p.maxHp,g.p.hp+40)}
  else if(c.t==='ash'){g.ashRun+=15}
  stats();
}
function cardHTML(c,i){
  const g=G;let ic,nm,tg,ds,hint='',pips='';
  if(c.t==='w'){const W_=WEAP[c.k],w=g.wep[c.k],l=w?w.l:0;ic=W_.ic;nm=W_.n;
    if(!w){tg='<span class="tg n">NEW WEAPON</span>';ds=W_.d}
    else{tg=`<span class="tg">LV ${l} → ${l+1}</span>`;const a=W_.s(l),b=W_.s(l+1);ds=Object.keys(b).filter(k=>a[k]!==b[k]).map(k=>`${k} ${a[k]} → <b>${b[k]}</b>`).join('<br>')}
    hint=`♦ max level + ${PAS[W_.evo].ic} ${PAS[W_.evo].n} → ${W_.en}`;
    pips='<div class="pips">'+Array.from({length:W_.max},(_,j)=>`<i class="${j<l+1?'f':''}"></i>`).join('')+'</div>'}
  else if(c.t==='p'){const P=PAS[c.k],l=g.pas[c.k]||0;ic=P.ic;nm=P.n;tg=l?`<span class="tg">LV ${l} → ${l+1}</span>`:'<span class="tg n">NEW</span>';ds=P.d;
    const ev=Object.keys(WEAP).filter(k=>WEAP[k].evo===c.k);if(ev.length)hint=`♦ evolves ${ev.map(k=>WEAP[k].ic+' '+WEAP[k].n).join(', ')}`;
    pips='<div class="pips">'+Array.from({length:P.max},(_,j)=>`<i class="${j<l+1?'f':''}"></i>`).join('')+'</div>'}
  else if(c.t==='heal'){ic='🩹';nm='Bandages';tg='<span class="tg n">HEAL</span>';ds='Restore 40 HP'}
  else{ic='⚱️';nm='Ash';tg='<span class="tg">ASH</span>';ds='+15 ash for the shop'}
  return`<div class="card" data-act="pick" data-i="${i}" style="animation-delay:${i*.06}s"><span class="num">${i+1}</span><div class="ic">${ic}</div><div class="nm">${nm}</div>${tg}<div class="ds">${ds}</div>${pips}${hint?`<div class="hint">${hint}</div>`:''}</div>`;
}
let CUR=[];
function openLevel(){
  const g=G;g.pending--;mode='lvl';sfx.lvl();CUR=choices(g.ch.cards);inputLock=performance.now()+250;
  OV.className='on clear';
  OV.innerHTML=`<h2>LEVEL ${g.lvl-g.pending}</h2><div class="row">${CUR.map(cardHTML).join('')}</div>

}
function pick(i){const c=CUR[i];if(!c||performance.now()<inputLock)return;apply(c);sfx.pick();close()}
function close(){const g=G;OV.className='';OV.innerHTML='';mode='play';if(g.chestQ){g.chestQ--;openChest()}else if(g.pending)openLevel()}
function reroll(){const g=G;if(!g.rerolls)return;g.rerolls--;sfx.ui();g.pending++;openLevel()}

/* ---------- chest ---------- */
function openChest(){
  const g=G;mode='chest';inputLock=performance.now()+1400;
  let ev=null;for(const k in g.wep){const w=g.wep[k];if(w.l>=WEAP[k].max&&!w.evo&&g.pas[WEAP[k].evo]){ev=k;break}}
  const res=[];
  if(ev){g.wep[ev].evo=true;res.push({ic:WEAP[ev].ic,n:'EVOLVED: '+WEAP[ev].en,d:WEAP[ev].ed,evo:1})}
  else{const r=R(),n=r<.06?5:r<.3?3:1;for(let i=0;i<n;i++){const o=choices(4).filter(c=>(c.t==='w'||c.t==='p')&&!c.nw);if(!o.length)break;const c=o[(R()*o.length)|0];apply(c);
      const D=c.t==='w'?WEAP[c.k]:PAS[c.k];res.push({ic:D.ic,n:D.n+' +1',d:''})}
    const a=8+(R()*12|0);g.ashRun+=a;res.push({ic:'⚱️',n:'+'+a+' ash',d:''})}
  stats();
  OV.className='on';
  const icons=[...Object.values(WEAP),...Object.values(PAS)].map(v=>v.ic);
  OV.innerHTML=`<div class="chest">⚱️</div><h2>RELIQUARY</h2><div class="reel" id="reel"></div><div id="cres" class="row"></div><div class="small" id="cgo"></div>`;
  let i=0;const reel=$('#reel'),iv=setInterval(()=>{reel.innerHTML=`<span>${icons[(R()*icons.length)|0]}</span>`;sfx.chestTick(i++);},70);
  setTimeout(()=>{clearInterval(iv);if(mode!=='chest')return;$('.chest').style.animation='none';reel.innerHTML='';
    if(ev)sfx.evo();else sfx.chest();
    $('#cres').innerHTML=res.map((r,j)=>`<div class="card ${r.evo?'evo':''}" style="animation-delay:${j*.12}s"><div class="ic">${r.ic}</div><div class="nm">${r.n}</div><div class="ds">${r.d}</div></div>`).join('');
    $('#cgo').innerHTML='<button class="btn pri" data-act="close">CONTINUE<span class="k">SPACE</span></button>'},1300);
}

  for(const e of g.en)if(e.type!=='she')kill(e);g.en=g.en.filter(e=>!e.dead);
  mode='dawnq';OV.className='on';inputLock=performance.now()+800;
  OV.innerHTML=`<h1>DAWN</h1><div class="sub">The sun finds the ward windows. You made it through the night.</div>
  <div class="row"><button class="btn pri" data-act="clockout">CLOCK OUT<span class="k">SPACE</span></button><button class="btn" data-act="overtime">STAY FOR OVERTIME<span class="k">O</span></button></div>
  <div class="small">overtime: endless night, she returns every two minutes, ash keeps piling up</div>`;
}
function overtime(){const g=G;g.endless=true;g.nextBoss=60;g.eliteT=20;close();msg('OVERTIME','the lights go out again',3,'#ff4a3d');sfx.boss()}
function end(){
  const g=G,greed=1+(S.up.greed||0)*.1;
  const base=g.kills/10+Math.min(g.t,RUN)/8+g.bossK*40+(g.dawn?100:0)+g.ashRun+(g.endless?(g.t-RUN)/3:0);
  const ash=Math.round(base*greed),prev=S.best;
  S.ash+=ash;S.runs++;S.kills+=g.kills;S.best=Math.max(S.best,g.t);S.bestLvl=Math.max(S.bestLvl,g.lvl);S.bestKills=Math.max(S.bestKills,g.kills);
  const nu=[];for(const k in CHARS)if(!S.chars[k]&&CHARS[k].ok&&CHARS[k].ok()){S.chars[k]=1;nu.push(k)}
  save();mode='over';inputLock=performance.now()+700;
  const rec=g.t>prev&&S.runs>1;
  const goal=Object.entries(CHARS).find(([k,c])=>!S.chars[k]);
  const aff=SHOP.filter(it=>(S.up[it.k]||0)<it.max&&cost(it,S.up[it.k]||0)<=S.ash);
  const cheap=SHOP.filter(it=>(S.up[it.k]||0)<it.max).sort((a,b)=>cost(a,S.up[a.k]||0)-cost(b,S.up[b.k]||0))[0];
  OV.className='on';
  OV.innerHTML=`<h2>${g.dawn?'SHIFT COMPLETE':'SHIFT OVER'}</h2>
  <div class="sub">${g.dawn?'Clocked out at '+clock(g.t)+'.':deathLine(g)}</div>
  ${rec?'<div class="rec">★ NEW RECORD ★</div>':(S.runs>1&&prev-g.t<45&&!g.dawn?`<div class="rec" style="color:#ffb347">${mmss(prev-g.t)} short of your best</div>`:'')}
  ${nu.map(k=>`<div class="unl">UNLOCKED · ${CHARS[k].ic} ${CHARS[k].n}</div>`).join('')}
  <div class="stats"><div class="st"><b>${mmss(g.t)}</b><span>SURVIVED</span></div><div class="st"><b>${g.kills}</b><span>KILLS</span></div><div class="st"><b>${g.lvl}</b><span>LEVEL</span></div><div class="st"><b>${g.maxCombo}</b><span>BEST COMBO</span></div></div>
  <div class="goal">Ash earned <span class="ash">+${ash} ⚱</span> · total <span class="ash">${S.ash} ⚱</span>${aff.length?` · <span style="color:var(--grn)">you can afford ${aff.length} upgrade${aff.length>1?'s':''}</span>`:cheap?` · next upgrade at ${cost(cheap,S.up[cheap.k]||0)} ⚱`:''}</div>
  ${goal?`<div class="goal">Next unlock: ${goal[1].ic} <b>${goal[1].n}</b> — ${goal[1].req}<div class="bar"><i style="width:${Math.min(100,goal[1].pr()*100)}%"></i></div></div>`:''}
  <div class="row"><button class="btn pri" data-act="start">NEW SHIFT<span class="k">SPACE</span></button><button class="btn" data-act="shop">SHOP${aff.length?' •':''}<span class="k">B</span></button><button class="btn" data-act="menu">MENU<span class="k">ESC</span></button></div>`;
}

function buy(k){const it=SHOP.find(i=>i.k===k),l=S.up[k]||0;if(l>=it.max)return;const c=cost(it,l);if(S.ash<c)return;S.ash-=c;S.up[k]=l+1;save();sfx.chest();const sc=OV.scrollTop;showShop(OV.dataset.from);OV.scrollTop=sc}

  else if(mode==='over'){if(performance.now()<inputLock)return;if(go)start();else if(c==='KeyB')showShop('over');else if(c==='Escape')showMenu()}

    else if(c==='ArrowLeft'||c==='ArrowRight'){const u=Object.keys(CHARS).filter(k=>S.chars[k]);let i=u.indexOf(S.char);i=(i+(c==='ArrowLeft'?-1:1)+u.length)%u.length;S.char=u[i];save();sfx.ui();showMenu()}}
